<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sanjeev Kamath · Portfolio</title>
  <link rel="stylesheet" href="sky.css">
  <link rel="stylesheet" href="atmosphere.css">
  <script defer src="sky.js"></script>
  <script defer src="cloud-letters.js"></script>
</head>
<body>
  <main>
    <section class="passage" id="top" aria-labelledby="name" tabindex="-1">
      <div class="sky">
        <img class="sky-cloud sky-cloud-back" src="atmosphere/scroll-cloud.webp" width="1774" height="887" alt="" draggable="false">
        <img class="sky-cloud sky-cloud-left" src="atmosphere/scroll-cloud.webp" width="1774" height="887" alt="" draggable="false">
        <img class="sky-cloud sky-cloud-right" src="atmosphere/scroll-cloud.webp" width="1774" height="887" alt="" draggable="false">
        <img class="sky-cloud sky-cloud-front" src="atmosphere/scroll-cloud.webp" width="1774" height="887" alt="" draggable="false">
        <div class="passage-mist" aria-hidden="true"></div>
        <header class="hero-header">
          <span class="monogram" aria-hidden="true">SK<span>.</span></span>
        </header>
        <div class="hero-intro">
          <h1 id="name" class="wordmark" aria-label="Sanjeev Kamath">
            <span class="letter-field" aria-hidden="true">
              <span class="letter" style="--left:2.427%; --top:0.00%; --width:14.656%"><img src="glyphs/s.webp" width="260" height="320" alt="" draggable="false"></span>
              <span class="letter" style="--left:16.497%; --top:0.70%; --width:15.107%"><img src="glyphs/a-1.webp" width="268" height="320" alt="" draggable="false"></span>
              <span class="letter" style="--left:31.136%; --top:-0.30%; --width:14.487%"><img src="glyphs/n.webp" width="257" height="320" alt="" draggable="false"></span>
              <span class="letter" style="--left:45.022%; --top:0.50%; --width:12.627%"><img src="glyphs/j.webp" width="224" height="320" alt="" draggable="false"></span>
              <span class="letter" style="--left:56.812%; --top:-0.45%; --width:13.191%"><img src="glyphs/e-1.webp" width="234" height="320" alt="" draggable="false"></span>
              <span class="letter" style="--left:69.227%; --top:0.55%; --width:12.570%"><img src="glyphs/e-2.webp" width="223" height="320" alt="" draggable="false"></span>
              <span class="letter" style="--left:81.225%; --top:-0.20%; --width:16.122%"><img src="glyphs/v.webp" width="286" height="320" alt="" draggable="false"></span>
              <span class="letter" style="--left:2.814%; --top:44.40%; --width:16.065%"><img src="glyphs/k.webp" width="285" height="328" alt="" draggable="false"></span>
              <span class="letter" style="--left:18.102%; --top:43.95%; --width:16.573%"><img src="glyphs/a-2.webp" width="294" height="328" alt="" draggable="false"></span>
              <span class="letter" style="--left:34.001%; --top:44.95%; --width:18.264%"><img src="glyphs/m.webp" width="324" height="328" alt="" draggable="false"></span>
              <span class="letter" style="--left:51.692%; --top:44.20%; --width:15.727%"><img src="glyphs/a-3.webp" width="279" height="328" alt="" draggable="false"></span>
              <span class="letter" style="--left:67.039%; --top:45.05%; --width:14.713%"><img src="glyphs/t.webp" width="261" height="328" alt="" draggable="false"></span>
              <span class="letter" style="--left:81.121%; --top:44.10%; --width:16.122%"><img src="glyphs/h.webp" width="286" height="328" alt="" draggable="false"></span>
            </span>
          </h1>
          <div class="scroll-cue">Scroll to descend <span aria-hidden="true">↓</span></div>
        </div>
      </div>
    </section>
    <section id="about" class="about" aria-labelledby="about-heading" tabindex="-1">
      <div class="about-cloud" aria-hidden="true">
        <img src="atmosphere/near-east.webp" width="760" height="365" alt="" draggable="false">
      </div>
      <div class="about-content">
        <p class="about-label">About me</p>
        <h2 id="about-heading">I’m Sanjeev.</h2>
        <p class="about-intro">I work in software engineering and creative technology. This portfolio is an experiment in making the web feel like a place you can explore.</p>
        <a class="return-link" href="#top">Back to the sky <span aria-hidden="true">↑</span></a>
      </div>
      <footer class="about-footer">© 2026 Sanjeev Kamath</footer>
    </section>
  </main>
</body>
</html>
